name: Talisman CMS Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Separate job: source-map builds must never become release archives or committed dist/.
      - run: pnpm test:coverage
      - name: Upload source coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-coverage
          path: |
            coverage/index.html
            coverage/**/*.html
            coverage/**/*.css
            coverage/**/*.js
            coverage/**/*.png
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 14

  manifests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      # release:verify builds every package; the committed dist/ must match that build.
      - name: Committed dist matches the build
        run: node scripts/check-dist-drift.mjs

  admin-browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter='!playground' build

      # Builds the playground, serves it with wrangler's local runtime (throwaway secrets, local D1 and
      # R2) and drives the admin's editing flows in the runner's Chrome with e2e/admin-flows.mjs.
      - name: Drive the admin in Chrome against the built playground
        run: |
          set -euo pipefail
          trap 'pnpm --filter playground exec astro preview stop || true; rm -f playground/.dev.vars playground/dist/server/.dev.vars' EXIT
          TOKEN="$(openssl rand -hex 32)"
          printf 'TALISMAN_AUTH_SECRET=%s\nTALISMAN_AUTH_SETUP_TOKEN=%s\nTALISMAN_COMMERCE_GIFT_CARD_KEY=%s\n' "$(openssl rand -hex 32)" "$TOKEN" "$(openssl rand -hex 32)" > playground/.dev.vars
          printf '%s\n' 'TALISMAN_COMMERCE_DELIVERY_COUNTRIES=US,SG' 'TALISMAN_COMMERCE_SHIPPING_RATES=[{"id":"standard","label":"Standard delivery","amount":800,"countries":["US","SG"],"freeOver":30000}]' >> playground/.dev.vars
          pnpm --filter playground build
          pnpm --filter talisman-cms db:migrate:local
          pnpm --filter talisman-cms db:seed:ecommerce:local
          # The real commerce browser flows require these synthetic paid-order fixtures.
          for fixture in commerce-aftercare commerce-purchasing commerce-recoveries commerce-returns storefront; do
            pnpm exec wrangler d1 execute DB --local --config playground/wrangler.toml --file "e2e/fixtures/$fixture.sql"
          done
          pnpm --filter playground exec astro preview --host 127.0.0.1 --port 8787
          for _ in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/admin)" = 200 ] && break
            sleep 1
          done
          status=0
          export TALISMAN_CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export TALISMAN_E2E_AFTERCARE_ORDER_ID=ord_99999999-9999-4999-8999-999999999999
          export TALISMAN_E2E_RETURNS_ORDER_ID=ord_77777777-7777-4777-8777-777777777777
          export TALISMAN_E2E_STOREFRONT_ORDERS=1
          TALISMAN_E2E_SETUP_TOKEN="$TOKEN" node e2e/admin-flows.mjs --base-url http://127.0.0.1:8787 --dist playground/dist --report e2e-report.json --artifacts e2e-artifacts || status=$?
          if [ "$status" = 0 ]; then
            TALISMAN_UI_BROWSER=1 pnpm --filter @talisman-cms/plugin-ui-daisyui exec node --test --test-concurrency=1 ./test/renderers.test.mjs ./test/theme-builder.browser.mjs || status=$?
          fi
          cat e2e-report.json
          exit "$status"
      - name: Upload admin and accessibility results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-browser
          path: |
            e2e-report.json
            e2e-artifacts/
          retention-days: 14

  hybrid-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter='!playground' build
      - name: Drive a local editor through hybrid authentication
        run: |
          set -euo pipefail
          trap 'pnpm --filter playground exec astro preview stop || true; rm -f playground/.dev.vars playground/dist/server/.dev.vars hybrid-editor.sql' EXIT
          printf 'TALISMAN_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > playground/.dev.vars
          pnpm --filter playground exec astro build --config astro.hybrid.config.mjs
          pnpm --filter talisman-cms db:migrate:local
          node e2e/seed-hybrid-editor.mjs > hybrid-editor.sql
          pnpm exec wrangler d1 execute DB --local --config playground/wrangler.toml --file hybrid-editor.sql
          pnpm --filter playground exec astro preview --config astro.hybrid.config.mjs --host 127.0.0.1 --port 8787
          for _ in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/admin)" = 200 ] && break
            sleep 1
          done
          export TALISMAN_CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          status=0
          node e2e/admin-flows.mjs --base-url http://127.0.0.1:8787 --auth-mode hybrid-editor --admin-email hybrid-editor@example.com --admin-password E2E-editor-password-2026 --dist playground/dist --report hybrid-e2e-report.json || status=$?
          cat hybrid-e2e-report.json
          exit "$status"
      - name: Upload hybrid browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hybrid-browser
          path: hybrid-e2e-report.json
          retention-days: 14

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Fails on high or critical advisories in the dependencies that ship or run in a site
      # (the lockfile's production graph, including the playground's).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
