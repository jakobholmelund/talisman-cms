name = "talisman-cms-playground"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "galaxy_cms_local"
database_id = "local-d1"
migrations_dir = "../packages/talisman-cms/drizzle"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "talisman-cms-media"

[images]
binding = "IMAGES"

[[kv_namespaces]]
binding = "KV"
id = "local-kv"
